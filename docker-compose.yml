name: viral-kar

# Local development infra only — MySQL and Redis that the backend needs to
# actually run. Not used for production deployment; a deployer may reuse
# these image/version choices or provision managed equivalents instead.
#
# Credentials below are dev-only placeholders, safe to commit — match them in
# apps/backend/.env.example (and your real apps/backend/.env).
#
# MySQL is mapped to host port 3307, not the default 3306, because a
# separately-installed native MySQL is commonly already running on 3306 on a
# dev machine — mapping to 3307 avoids fighting over the port or silently
# talking to the wrong database. If you already have a working native MySQL
# (e.g. one Prisma has already migrated against), it's simplest to keep using
# that on 3306 and only rely on this compose file for Redis — see
# apps/backend/.env.example for both options.
#
# RabbitMQ isn't provisioned here — despite once being planned, nothing in
# apps/backend actually uses it. All background jobs run on BullMQ, which is
# Redis-backed (see docs/architecture/README.md).
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: viral_kar_root_dev
      MYSQL_DATABASE: viral_kar
      MYSQL_USER: viral_kar
      MYSQL_PASSWORD: viral_kar_dev
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pviral_kar_root_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:

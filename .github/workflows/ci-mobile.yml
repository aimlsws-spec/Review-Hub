name: CI — Mobile

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-mobile.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate freezed/json_serializable code
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

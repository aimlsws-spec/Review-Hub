name: CI — AI Services

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/ai-services/**"
      - ".github/workflows/ci-ai-services.yml"
  push:
    branches: [main]
    paths:
      - "apps/ai-services/**"
      - ".github/workflows/ci-ai-services.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/ai-services/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/ai-services
        run: pip install -r requirements-dev.txt

      - name: Test
        working-directory: apps/ai-services
        run: pytest

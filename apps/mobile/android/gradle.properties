org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
# Compile Kotlin inside the Gradle process instead of a separate Kotlin daemon JVM,
# so a build fits on an 8 GB development machine.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

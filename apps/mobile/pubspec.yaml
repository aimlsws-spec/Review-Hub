name: viral_kar
description: VIRAL KAR — AI-powered digital engagement & rewards platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2

  # Routing
  go_router: ^17.5.0

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^7.3.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.0.0

  # Data classes / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # UI
  google_fonts: ^8.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # Media
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.3
  equatable: ^2.0.5
  logger: ^2.3.0

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.11
  freezed: ^3.2.5
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/

  # fonts are pulled from google_fonts at runtime — no bundled font files needed

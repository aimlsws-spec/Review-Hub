name: viral_kar
description: Viralkar — AI-powered digital engagement & rewards platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2

  # Routing
  go_router: ^17.5.0

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^7.3.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Pinned below 11.x: 11.0.0 raised compileSdk to 37, whose SDK platform
  # package is published as "android-37.0" (not "android-37") — this
  # project's Gradle/AGP resolves compileSdk 37 to the old-style
  # "android-37" target hash and fails to find it. 10.3.1 targets
  # compileSdk 36, matches installed SDK exactly, no functional loss (see
  # core_providers.dart).
  flutter_secure_storage: ">=10.3.1 <11.0.0"

  # Data classes / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # UI
  google_fonts: ^8.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.9.3

  # Media
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.3
  equatable: ^2.0.5
  logger: ^2.3.0

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  local_auth: ^3.0.2
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  geolocator: ^14.0.3
  app_links: ^7.2.1
  mobile_scanner: ^7.4.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  fl_chart: ^1.2.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.11
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  change_app_package_name: ^1.5.0
  flutter_native_splash: ^2.4.3
  geolocator_platform_interface: ^4.3.0
  app_links_platform_interface: ^2.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # The app's settings (AppConfig). Copy .env.example to .env; .env itself is not in git.
    - .env

  # fonts are pulled from google_fonts at runtime — no bundled font files needed

# Native (pre-Flutter-engine) splash screen — generated via `dart run
# flutter_native_splash:create`. Colors match AppColors (navy900/white),
# so this hands off seamlessly into the in-app SplashScreen widget.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_icon_android12.png
    icon_background_color: "#FFFFFF"

# The app's home-screen icon: the Viralkar K. The sources in assets/icon/ are rendered from
# assets/images/viralkar_icon.svg by tool/make_app_icon.js; after changing them run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  # Android 8+ crops icons to the phone's shape (circle, squircle...): the K on a white layer, kept inside the crop.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21
